services:
  pgvector:
    image: pgvector/pgvector:pg17
    container_name: bd2-pgvector
    environment:
      POSTGRES_PASSWORD: bd2
      POSTGRES_DB: vectores
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vectores"]
      interval: 3s
      timeout: 3s
      retries: 20
